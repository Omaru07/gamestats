# nginx de la consola: sirve la página y reparte /api/... a cada servicio por su nombre
# en la red de Docker. La "/" al final de proxy_pass quita el prefijo:
#   /api/ingest/events  ->  http://go-ingest:8080/events
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # GameStats, parte Go: recibe los eventos y cuenta las instancias en vivo
    location /api/ingest/ {
        proxy_pass http://go-ingest:8080/;
    }

    # GameStats, parte Scala: estadísticas por juego y generales
    location /api/stats/ {
        proxy_pass http://scala-analytics:8081/;
    }

    # IA de Conecta 4 en Prolog
    location /api/ai/ {
        proxy_pass http://prolog-ai:8082/;
        proxy_read_timeout 30s;
    }
}
