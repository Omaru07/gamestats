# docker-compose.yml — levanta Go, Scala y la IA de Prolog. El simulador se corre aparte (perfil "tools").
#   docker compose up --build              -> arranca Scala, Go y Prolog
#   docker compose run --rm simulator      -> manda las partidas simuladas
services:
  scala-analytics:
    build: ./scala-analytics
    ports:
      - "${SCALA_PORT:-8081}:8081" # cambiar con SCALA_PORT si el 8081 está ocupado
    environment:
      OUTPUT_DIR: /output
    volumes:
      - ./output:/output # los resultados JSON quedan en ./output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  go-ingest:
    build:
      context: . # contexto en la raíz porque la imagen también copia games/
      dockerfile: go-ingest/Dockerfile
    ports:
      - "${GO_PORT:-8080}:8080" # cambiar con GO_PORT si el 8080 está ocupado
    environment:
      SCALA_URL: http://scala-analytics:8081 # por nombre de servicio, no localhost
    depends_on:
      scala-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  prolog-ai:
    build: ./prolog-ai # las pruebas de Prolog corren al construir esta imagen
    ports:
      - "${PROLOG_PORT:-8082}:8082" # cambiar con PROLOG_PORT si el 8082 está ocupado
    healthcheck:
      # La imagen de SWI-Prolog no trae curl ni wget: el chequeo lo hace el mismo Prolog.
      test: ["CMD", "swipl", "-g", "use_module(library(http/http_open)),http_open('http://localhost:8082/health',S,[]),close(S)", "-t", "halt"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  simulator:
    build: ./simulator
    environment:
      INGEST_URL: http://go-ingest:8080
      SCALA_URL: http://scala-analytics:8081 # para mostrar al final lo que Scala analizó
    depends_on:
      go-ingest:
        condition: service_healthy
    profiles: ["tools"] # no arranca con "up"; se usa con "run"
